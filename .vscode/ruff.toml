line-length = 88

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    ".pyenv",              # Excludes your pyenv installation paths (e.g., /Users/jethroestrada/.pyenv/...)
    "**/lib/python*/",     # Broader stdlib exclusion (covers site-packages and stdlib dirs)
]

[lint]
select = ["W291", "W293", "D205", "F401"]  # Whitespace/EOF rules + unused imports
ignore = ["E501", "E402"]                  # Ignore line length and import-position errors
fixable = ["W291", "W293", "D205", "F401"] # Enable safe fixes for selected rules (replaces fix = true)

[format]
indent-style = "space"  # Use spaces for indentation (4 spaces by default, matches editor.tabSize)
quote-style = "double"  # Use double quotes for strings (PEP 8, avoids escapes)
line-ending = "lf"      # Ensure newline at EOF with \n (adds if missing)
